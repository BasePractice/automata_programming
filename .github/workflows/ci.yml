name: build

# Одна сборка проверяет весь курс: PDF лекций, примеры на C90 и оформление кода.
on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  style:
    name: Оформление кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Версия зафиксирована намеренно. clang-format 18 и старше сжимает
      # завершающие комментарии, начиная с 19-й они выравниваются в столбик:
      # одна и та же команда --fix на разных машинах давала разный код, и CI
      # объявлял расходящимися файлы, оформленные правильно. Пакет из PyPI
      # даёт одинаковый бинарь на любой системе, в отличие от apt.
      - name: Установить clang-format
        run: |
          python3 -m venv .cf-venv
          .cf-venv/bin/pip install --quiet 'clang-format==20.1.8'
          .cf-venv/bin/clang-format --version

      - name: Проверить оформление кода
        run: CLANG_FORMAT="$PWD/.cf-venv/bin/clang-format" ./scripts/check-style.sh --require-clang-format

  practice:
    name: Практикум (C90, ${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Release нужен отдельно: с NDEBUG исчезают assert, и код, который
        # «работал» за счёт срабатывания assert, ломается именно здесь.
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v7

      - name: Конфигурация
        run: >
          cmake -S . -B build
          -DSTATECRAFT_BUILD_LECTURES=OFF
          -DSTATECRAFT_STRICT=ON
          -DSTATECRAFT_BUILD_TUI=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Сборка примеров
        run: cmake --build build -j 4

      - name: Тесты
        run: ctest --test-dir build --output-on-failure

  docs:
    name: Документация практикума (Doxygen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Установить doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      # Ключ --strict: молчаливый пропуск здесь означал бы, что задание
      # зелёное, ничего не проверив. Разметка комментариев проверяется самим
      # doxygen — Doxyfile поднимает WARN_AS_ERROR.
      - name: Собрать документацию
        run: ./scripts/build-docs.sh --strict

      - name: Выложить документацию
        uses: actions/upload-artifact@v7
        with:
          name: practices-docs
          path: build/docs/html
          if-no-files-found: error

  promela:
    name: Модели Promela (SPIN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Установить SPIN
        run: sudo apt-get update && sudo apt-get install -y spin

      - name: Разбор и верификация моделей
        run: ./scripts/check-promela.sh --verify

  lectures:
    name: Лекции (typst)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Установить typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'

      - name: Проверить окружение лекций
        run: cd lectures && make check

      # Листинги лекций — копии файлов практикума (typst читает только из
      # своего --root). Копии молча расходятся с оригиналом, поэтому
      # расхождение здесь — ошибка сборки.
      - name: Листинги совпадают с практикумом
        run: cd lectures && make sync-check

      - name: Собрать PDF
        run: >
          cmake -S . -B build -DSTATECRAFT_BUILD_PRACTICE=OFF &&
          cmake --build build -j 4

      - name: Незакрытые блоки #todo
        run: |
          count=$(grep -rn '#todo\[' lectures/src/ | wc -l | tr -d ' ')
          echo "Незакрытых блоков #todo: $count"
          echo "todo=$count" >> "$GITHUB_STEP_SUMMARY"

      - name: Выложить PDF
        uses: actions/upload-artifact@v7
        with:
          name: lectures-pdf
          path: build/lectures/*.pdf
          if-no-files-found: error

  misra:
    name: MISRA C:2012 (оценка)
    runs-on: ubuntu-latest
    # Проверка оценочная: она показывает, как промышленный набор правил
    # смотрит на учебный код. Её находки разбираются в docs/misra-report.md,
    # и падать от них сборка курса не должна.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Установить cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Прогнать анализ
        run: ./scripts/check-misra.sh --strict --raw misra-raw.txt | tee misra-summary.txt

      - name: Сводка в отчёт прогона
        run: |
          {
            echo '### MISRA C:2012'
            echo '```'
            cat misra-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Выложить полный вывод
        uses: actions/upload-artifact@v7
        with:
          name: misra-raw
          path: misra-raw.txt
          if-no-files-found: error

  # --- факультативные задания -----------------------------------------------
  # Дальше идёт то, что зависит от внешних инструментов: компилятора Takt и
  # raylib. Оба ставятся из исходников и к предмету курса отношения не имеют,
  # поэтому их отказ не должен закрывать дорогу материалу — задания помечены
  # continue-on-error.

  takt:
    name: Инструменты Takt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Забрать исходники Takt
        uses: actions/checkout@v7
        with:
          repository: Pastor/Takt
          ref: v2
          path: takt

      # Версию компилятора Rust задаёт rust-toolchain.toml самого Takt —
      # rustup поставит её сам при первой сборке.
      - name: Кеш сборки Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            takt/target
          key: takt-${{ runner.os }}-${{ hashFiles('takt/Cargo.lock') }}
          restore-keys: takt-${{ runner.os }}-

      - name: Собрать taktc и takt-sim
        working-directory: takt
        run: |
          cargo build --release -p takt-lang --bin taktc
          cargo build --release -p takt-sim --bin takt-sim

      - name: Выложить инструменты
        uses: actions/upload-artifact@v7
        with:
          name: takt-${{ matrix.os }}
          path: |
            takt/target/release/taktc
            takt/target/release/takt-sim
          if-no-files-found: error

  gui:
    name: Графика погрузчика (raylib, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    needs: takt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Взять инструменты Takt
        uses: actions/download-artifact@v8
        with:
          name: takt-${{ matrix.os }}
          path: takt-bin

      - name: Права на запуск
        run: chmod +x takt-bin/taktc takt-bin/takt-sim

      # В Ubuntu 24.04 пакета raylib нет вовсе (проверено: apt не знает ни
      # libraylib-dev, ни raylib), а бинарный архив с сайта проекта идёт без
      # cmake-конфигурации, поэтому find_package(raylib) его не находит.
      # Остаётся сборка из исходников; версия — та же, что ставит brew.
      - name: Установить raylib
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev \
                                    libxinerama-dev libxcursor-dev libxi-dev
            git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git raylib-src
            cmake -S raylib-src -B raylib-src/build \
                  -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF
            sudo cmake --build raylib-src/build --target install -j 4
          else
            brew install raylib
          fi

      - name: Конфигурация
        run: >
          cmake -S . -B build
          -DSTATECRAFT_BUILD_LECTURES=OFF
          -DSTATECRAFT_STRICT=ON
          -DSTATECRAFT_BUILD_GUI=ON
          -DSTATECRAFT_TAKT_DIR="$PWD/takt-bin"
          -DCMAKE_BUILD_TYPE=Release

      - name: Сборка
        run: cmake --build build -j 4

      # Обе цели пропускаются молча, когда инструмента нет: проверяем, что
      # задание действительно собрало графику, а не прошло вхолостую.
      - name: Цели собраны, а не пропущены
        run: |
          test -x build/practices/21-additional/loader-gui/21-additional-gui
          test -x build/practices/21-additional/loader/21-additional-run

      # С taktc собираются и проверяются практики 12-takt и 21-additional,
      # которых в основном задании нет.
      - name: Тесты
        run: ctest --test-dir build --output-on-failure

      # Требование ТД-9: без дисплея приложение обязано завершиться внятным
      # сообщением, а не падением. Запускать окно в CI негде, поэтому
      # проверяется именно это; ключ --frames ограничивает прогон на случай,
      # когда графический контекст всё же создан.
      - name: Без дисплея — сообщение, а не падение
        run: |
          cd build/practices/21-additional/loader-gui
          set +e
          ./21-additional-gui --frames 2 --shot shot.png > out.txt 2> err.txt
          code=$?
          set -e
          echo "код возврата: $code"
          cat out.txt err.txt
          if [ "$code" -ge 128 ]; then
            echo "приложение снято сигналом $((code - 128))" >&2
            exit 1
          fi
          if [ "$code" -ne 0 ] && ! grep -q "графический вывод недоступен" err.txt; then
            echo "завершилось с ошибкой, но без объяснения" >&2
            exit 1
          fi
